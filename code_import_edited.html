        // ================= RENDER ENGINE =================
        let currentTab = 'cover';
        const canvas = document.getElementById('canvas');

        function getTabOrder() {
            const tabs = [];
            dashboardData.forEach(item => {
                if (item.type === 'tab_button' && !tabs.includes(item.targetTab)) {
                    tabs.push(item.targetTab);
                }
            });
            return tabs;
        }
        const tabOrder = getTabOrder();

        function switchToTab(tabId) {
            if (tabId && tabOrder.includes(tabId)) {
                currentTab = tabId;
                renderEngine();
            }
        }

        function nextTab() {
            const idx = tabOrder.indexOf(currentTab);
            if (idx < tabOrder.length - 1) switchToTab(tabOrder[idx + 1]);
        }

        function prevTab() {
            const idx = tabOrder.indexOf(currentTab);
            if (idx > 0) switchToTab(tabOrder[idx - 1]);
        }

        // Keyboard Navigation Handlers
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                nextTab();
            } else if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                prevTab();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextTab();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevTab();
            }
        });

        function renderEngine() {
            canvas.innerHTML = '';
            dashboardData.forEach(item => {
                if (item.tab !== 'all' && item.tab !== currentTab) return;
                canvas.appendChild(renderNode(item));
            });

            // Update Active Tab Button Styles
            document.querySelectorAll('.tab_button').forEach(el => {
                const ref = el.__dataRef;
                if (ref && ref.type === 'tab_button') {
                    el.classList.toggle('active', currentTab === ref.targetTab);
                }
            });

            initCharts();
        }

        function renderNode(nodeData) {
            const el = document.createElement('div');
            el.className = 'element';
            if (nodeData.type === 'tab_button') el.classList.add('tab_button');
            el.__dataRef = nodeData;

            el.style.left = nodeData.x + 'px';
            el.style.top = nodeData.y + 'px';
            if (nodeData.width) el.style.width = nodeData.width + 'px';
            if (nodeData.height) el.style.height = nodeData.height + 'px';

            if (nodeData.type === 'text') {
                el.innerText = nodeData.text;
                el.style.fontSize = nodeData.fontSize + 'px';
                el.style.color = nodeData.color || '#fff';
                if (nodeData.fontWeight) el.style.fontWeight = nodeData.fontWeight;
                el.style.whiteSpace = 'nowrap';
                el.style.lineHeight = '1';
                if (nodeData.letterSpacing) el.style.letterSpacing = nodeData.letterSpacing + 'px';
            } else if (nodeData.type === 'rect') {
                el.style.background = nodeData.bg;
                if (nodeData.border) el.style.border = nodeData.border;
                if (nodeData.radius) el.style.borderRadius = typeof nodeData.radius === 'number' ? nodeData.radius + 'px' : nodeData.radius;
                if (nodeData.shadow) el.style.boxShadow = nodeData.shadow;
            } else if (nodeData.type === 'line') {
                el.style.backgroundColor = nodeData.color;
                if (nodeData.radius) el.style.borderRadius = nodeData.radius + 'px';
            } else if (nodeData.type === 'tab_button') {
                el.innerText = nodeData.text;
                el.style.fontSize = nodeData.fontSize + 'px';
                el.style.fontWeight = nodeData.fontWeight || 'bold';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.borderRadius = '4px';
                el.style.color = (currentTab === nodeData.targetTab) ? '#00E6A5' : '#9ca3af';
                el.addEventListener('click', () => {
                    currentTab = nodeData.targetTab;
                    renderEngine();
                });
            } else if (nodeData.type === 'chart_node') {
                el.innerHTML = `<canvas id="${nodeData.chartId}" style="width:100%; height:100%;"></canvas>`;
            } else if (nodeData.type === 'group' && nodeData.children) {
                nodeData.children.forEach(child => el.appendChild(renderNode(child)));
            }
            return el;
        }

        // ================= MULTI-CHART INITIALIZATION =================
        let activeCharts = [];
        function initCharts() {
            activeCharts.forEach(c => c.destroy());
            activeCharts = [];

            if (currentTab === 'multidim') {
                // Chart 1: Line Chart (Top)
                const ctxLine = document.getElementById('cubeChart');
                if (ctxLine) {
                    const lineChart = new Chart(ctxLine, {
                        type: 'line',

                        options: {

                            maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: '#9ca3af', font: { size: 10 } } }
                            },
                            scales: {
                                x: { grid: { color: '#1f293d' }, ticks: { color: '#9ca3af', font: { size: 9 } } },
                                y: { grid: { color: '#1f293d' }, ticks: { color: '#9ca3af', font: { size: 9 } } }
                            }
                        }
                    });
                    activeCharts.push(lineChart);
                }

                // Chart 2: Bar Chart (Bottom Left)
                const ctxBar = document.getElementById('barChart');
                if (ctxBar) {
                    const barChart = new Chart(ctxBar, {
                        type: 'bar',
                        data: {
                            labels: ['East', 'West', 'South', 'North'],
                            datasets: [{
                                label: 'Variance',
                                data: [65, 45, 85, 92],

                                borderRadius: 4

                        options: {

                            plugins: {
                                legend: { display: false }

                            scales: {
                                x: { grid: { display: false }, ticks: { color: '#9ca3af', font: { size: 9 } } },
                                y: { grid: { color: '#1f293d' }, ticks: { color: '#9ca3af', font: { size: 9 } } }
                            }
                        }
                    });
                    activeCharts.push(barChart);
                }

                // Chart 3: Polar Area Chart (Bottom Right)
                const ctxPolar = document.getElementById('polarChart');
                if (ctxPolar) {
                    const polarChart = new Chart(ctxPolar, {
                        type: 'polarArea',
                        data: {
                            labels: ['SaaS', 'PaaS', 'IaaS'],
                            datasets: [{
                                data: [40, 30, 30],
                                backgroundColor: [
                                    'rgba(0, 230, 165, 0.7)',
                                    'rgba(59, 130, 246, 0.7)',
                                    'rgba(245, 158, 11, 0.7)'
                                ],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { color: '#9ca3af', font: { size: 9 } } }
                            },
                            scales: {
                                r: { grid: { color: '#1f293d' }, ticks: { display: false } }
                            }
                        }
                    });
                    activeCharts.push(polarChart);
                }
            }
        }

        // Initial Render
        renderEngine();
